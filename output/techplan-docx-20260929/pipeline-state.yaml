environment_note: >
  插件自带的 setup-html-to-docx.sh 在 Windows 上按 Unix 布局探测 $VENV/bin/python，
  而 uv 在 Windows 建的是 Scripts/python.exe，导致脚本判定 venv 缺失后 rm -rf 重建，
  随后的 uv pip install 因解释器路径不存在而静默失败并被 set -e 中断。
  本次绕过脚本，直接对该 venv 执行：
    uv pip install --python <venv>/Scripts/python.exe --only-binary=:all: -r requirements.txt

